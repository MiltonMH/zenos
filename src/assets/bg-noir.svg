<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 874" width="402" height="874">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#18191C"/>
      <stop offset="55%" stop-color="#0F1113"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <radialGradient id="teal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6FDCCB" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#6FDCCB" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6FDCCB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="foldLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2E3238" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#2E3238" stop-opacity="0.65"/>
      <stop offset="65%" stop-color="#2E3238" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2E3238" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="foldMid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#20242A" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#20242A" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#20242A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#20242A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="foldDeep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#000000" stop-opacity="0.42"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#AEB8BE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#AEB8BE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#AEB8BE" stop-opacity="0"/>
    </linearGradient>
    <filter id="blob" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="thin" x="-100%" y="-200%" width="300%" height="500%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="402" height="874" fill="url(#base)"/>

  <!-- subtle Zenion-teal glow, upper right — the one spot of color, for depth and brand tie-in -->
  <ellipse cx="308" cy="82" rx="220" ry="200" fill="url(#teal)" filter="url(#glow)"/>

  <!-- soft organic folds in neutral graphite, same layered-depth idea as the other backgrounds -->
  <ellipse cx="48" cy="250" rx="230" ry="200" fill="url(#foldLight)" filter="url(#blob)"/>
  <ellipse cx="340" cy="640" rx="260" ry="230" fill="url(#foldMid)" filter="url(#blob)"/>
  <ellipse cx="130" cy="800" rx="250" ry="210" fill="url(#foldDeep)" filter="url(#blob)"/>

  <!-- diagonal light streak/loop, a soft sheen sweeping across the dark glass -->
  <ellipse cx="201" cy="430" rx="260" ry="16" fill="url(#streak)" filter="url(#thin)" transform="rotate(-20 201 430)"/>
</svg>

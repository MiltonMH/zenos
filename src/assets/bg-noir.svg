<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 874" width="402" height="874">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17191C"/>
      <stop offset="55%" stop-color="#101214"/>
      <stop offset="100%" stop-color="#0A0B0D"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24282D" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#141619" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#1E2226" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#101315" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="teal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6FDCCB" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#6FDCCB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9BA6AC" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9BA6AC" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#9BA6AC" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="72"/>
    </filter>
  </defs>

  <rect width="402" height="874" fill="url(#base)"/>

  <!-- subtle Zenion-teal glow, upper right — the one spot of color, for depth and brand tie-in -->
  <ellipse cx="304" cy="78" rx="230" ry="210" fill="url(#teal)" filter="url(#soft2)"/>

  <!-- soft organic wave folds in neutral graphite, same layered-depth idea as the other backgrounds -->
  <path d="M0,522 C112,470 182,562 262,520 C332,484 372,542 402,512 L402,874 L0,874 Z" fill="url(#waveA)" filter="url(#soft)"/>
  <path d="M0,646 C92,604 224,684 302,632 C352,600 382,652 402,632 L402,874 L0,874 Z" fill="url(#waveB)" filter="url(#soft)"/>

  <!-- diagonal light streak/loop, a soft sheen sweeping across the dark glass -->
  <rect x="-120" y="118" width="660" height="86" fill="url(#streak)" filter="url(#soft)" transform="rotate(-18 201 437)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 874" width="402" height="874">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#F9F6F1"/>
      <stop offset="55%" stop-color="#F2F5F6"/>
      <stop offset="100%" stop-color="#EAF0F1"/>
    </linearGradient>
    <radialGradient id="teal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6FDCCB" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#6FDCCB" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6FDCCB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="foldWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="foldCool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CBDFDC" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#CBDFDC" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#CBDFDC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="foldSand" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E2D6B8" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#E2D6B8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E2D6B8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blob" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="68"/>
    </filter>
    <filter id="thin" x="-100%" y="-200%" width="300%" height="500%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="402" height="874" fill="url(#base)"/>

  <!-- subtle Zenion-teal glow, upper right — the one spot of color, for depth -->
  <ellipse cx="336" cy="90" rx="210" ry="190" fill="url(#teal)" filter="url(#glow)"/>

  <!-- soft organic folds, same layered-depth idea as Mint/Färgrik but achromatic -->
  <ellipse cx="52" cy="240" rx="230" ry="200" fill="url(#foldWarm)" filter="url(#blob)"/>
  <ellipse cx="340" cy="640" rx="260" ry="230" fill="url(#foldCool)" filter="url(#blob)"/>
  <ellipse cx="130" cy="790" rx="250" ry="200" fill="url(#foldSand)" filter="url(#blob)"/>

  <!-- diagonal light streak/loop, gives the frosted glass above something to catch -->
  <ellipse cx="201" cy="430" rx="260" ry="16" fill="url(#streak)" filter="url(#thin)" transform="rotate(-20 201 430)"/>
</svg>
